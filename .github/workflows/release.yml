name: Release APK

# À chaque tag de version (ex. 2.2.0) : tests, APK signé, puis release brouillon avec l'APK attaché.
# Il reste à rédiger les notes et à publier la release depuis GitHub.
# Sans les secrets de signature, le workflow s'arrête avec un avertissement (release manuelle).
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag correspond à versionName
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à versionName ($VERSION) dans app/build.gradle.kts"
            exit 1
          fi

      - name: Vérifier les secrets de signature
        id: signing
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::Secrets de signature absents : APK à générer et attacher à la main (voir le README)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.enabled == 'true'

      - name: Tests unitaires
        if: steps.signing.outputs.enabled == 'true'
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: APK de release signé
        if: steps.signing.outputs.enabled == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$SIGNING_KEYSTORE_PATH"
          ./gradlew :app:assembleRelease --console=plain
          rm -f "$SIGNING_KEYSTORE_PATH"
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Release brouillon
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" --draft --verify-tag \
              --title "v$GITHUB_REF_NAME" --generate-notes
          fi
